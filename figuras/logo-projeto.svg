<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 164" width="700" height="164" role="img" aria-label="Logo do projeto modelo-tcc-depro-ufs">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09193F"/>
      <stop offset="55%" stop-color="#0F2863"/>
      <stop offset="100%" stop-color="#173B8C"/>
    </linearGradient>
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133178"/>
      <stop offset="100%" stop-color="#1E4BB3"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="696" height="160" rx="22"/>
    </clipPath>
    <style>
      .eyebrow { fill: #93C5FD; font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; }
      .title { fill: #FFFFFF; font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 31px; font-weight: 800; letter-spacing: -0.3px; }
      .subtitle { fill: #CBD5E1; font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 14px; font-weight: 500; }
      .pill-text { font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <!-- Card principal autocontido (alto contraste em tema claro e escuro) -->
  <rect x="2" y="2" width="696" height="160" rx="22" fill="url(#cardBg)" stroke="#3B82F6" stroke-opacity="0.38" stroke-width="1.5"/>
  <!-- Detalhe geométrico sutil no canto direito -->
  <g clip-path="url(#cardClip)">
    <circle cx="655" cy="24" r="76" fill="#3B82F6" fill-opacity="0.08"/>
    <circle cx="672" cy="146" r="52" fill="#F59E0B" fill-opacity="0.06"/>
  </g>

  <!-- Emblema esquerdo -->
  <rect x="20" y="20" width="124" height="124" rx="26" fill="url(#emblemBg)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2"/>
  <circle cx="82" cy="82" r="54" fill="url(#glowGrad)"/>

  <!-- Engrenagem geométrica de 12 dentes (DEPRO) -->
  <path d="M121.09,76.29 L129.83,77.92 L129.83,86.08 L121.09,87.71 L118.70,96.60 L125.46,102.38 L121.38,109.44 L113.00,106.49 L106.49,113.00 L109.44,121.38 L102.38,125.46 L96.60,118.70 L87.71,121.09 L86.08,129.83 L77.92,129.83 L76.29,121.09 L67.40,118.70 L61.62,125.46 L54.56,121.38 L57.51,113.00 L51.00,106.49 L42.62,109.44 L38.54,102.38 L45.30,96.60 L42.91,87.71 L34.17,86.08 L34.17,77.92 L42.91,76.29 L45.30,67.40 L38.54,61.62 L42.62,54.56 L51.00,57.51 L57.51,51.00 L54.56,42.62 L61.62,38.54 L67.40,45.30 L76.29,42.91 L77.92,34.17 L86.08,34.17 L87.71,42.91 L96.60,45.30 L102.38,38.54 L109.44,42.62 L106.49,51.00 L113.00,57.51 L121.38,54.56 L125.46,61.62 L118.70,67.40 Z" fill="url(#gearGrad)" opacity="0.97"/>
  <circle cx="82" cy="82" r="29" fill="#0D2562"/>
  <circle cx="82" cy="82" r="28.5" fill="none" stroke="#93C5FD" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Documento acadêmico (TCC / LaTeX) -->
  <path d="M67 63 H89 L97 71 V101 C97 102.1 96.1 103 95 103 H67 C65.9 103 65 102.1 65 101 V65 C65 63.9 65.9 63 67 63 Z" fill="#FFFFFF"/>
  <!-- Dobra da página -->
  <path d="M89 63 V69 C89 70.1 89.9 71 91 71 H97 Z" fill="#93C5FD"/>
  <!-- Linhas tipográficas e marcador dourado UFS -->
  <rect x="70" y="70" width="14" height="3.2" rx="1.6" fill="url(#accentGrad)"/>
  <rect x="70" y="77" width="21" height="2.6" rx="1.3" fill="#1E3A8A"/>
  <rect x="70" y="83" width="21" height="2.6" rx="1.3" fill="#64748B"/>
  <rect x="70" y="89" width="15" height="2.6" rx="1.3" fill="#64748B"/>
  <rect x="70" y="95" width="18" height="2.6" rx="1.3" fill="#CBD5E1"/>

  <!-- Tipografia principal -->
  <text x="168" y="47" class="eyebrow">UNIVERSIDADE FEDERAL DE SERGIPE · DEPRO</text>
  <text x="168" y="84" class="title">Modelo TCC · DEPRO/UFS</text>
  <text x="168" y="107" class="subtitle">Template LaTeX (abnTeX2) em conformidade com as normas ABNT</text>

  <!-- Selos informativos -->
  <g transform="translate(168, 121)">
    <rect x="0" y="0" width="114" height="24" rx="12" fill="#1E3A8A" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1"/>
    <text x="57" y="16" text-anchor="middle" fill="#DBEAFE" class="pill-text">ABNT NBR 14724</text>

    <rect x="124" y="0" width="80" height="24" rx="12" fill="#064E3B" stroke="#34D399" stroke-opacity="0.45" stroke-width="1"/>
    <text x="164" y="16" text-anchor="middle" fill="#A7F3D0" class="pill-text">abnTeX2</text>

    <rect x="214" y="0" width="100" height="24" rx="12" fill="#78350F" fill-opacity="0.7" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="1"/>
    <text x="264" y="16" text-anchor="middle" fill="#FDE68A" class="pill-text">LaTeX · CSV</text>
  </g>
</svg>
