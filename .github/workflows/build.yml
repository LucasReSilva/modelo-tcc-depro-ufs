name: Compilar PDF (LaTeX)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Compilar tcc-depro-ufs.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: tcc-depro-ufs.tex
          latexmk_use_lualatex: false

      - name: Publicar PDF compilado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: tcc-depro-ufs-pdf
          path: tcc-depro-ufs.pdf
